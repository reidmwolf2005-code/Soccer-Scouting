name: Weekly Roster Scrape

on:
  schedule:
    - cron: '0 11 * * 1'  # Every Monday at 6am CST (11am UTC)
  workflow_dispatch:        # Also allows manual trigger from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        env:
          SUPABASE_URL: https://bqhjdxmetwrcyrftefiq.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scraper.js
